name: Build and Push Docker Image
on:
  push:
    branches: [ '*' ]
    tags: [ '*' ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      HOME: /root
      GOPROXY: https://goproxy.cn,direct 
      GOBIN: /root/go/bin
      GOROOT: /root/sdk/go
      GOPATH: /root/go
      GOCACHE: /tmp/go-build-cache
      GOMODCACHE: /tmp/go-mod-cache
    steps:
      - name: Checkout
        uses: http://172.12.78.53:5000/krab/checkout@v7
      - name: Build and Push Docker Image
        run: |
          # 优先读取 Gitea 特有的 GITEA_REF，若无则使用 GITHUB_REF
          REF_NAME="${GITEA_REF:-$GITHUB_REF}"
          REGISTRY="registry.cn-hangzhou.aliyuncs.com/serialt/caddy-op"
          CHART="FALSE"
          if [[ "$REF_NAME" == refs/tags/* ]]; then
            # 匹配 Tag 推送: 提取 v1.0.0
            TAG_NAME="${REF_NAME#refs/tags/}"
            CHART="TRUE"
          else
            # 匹配普通分支推送: 生成时间戳 dev-YYYYMMDDHHMMSS
            TAG_NAME="dev-$(date +%Y%m%d%H%M%S)"
          fi
          IMAGE_TAG="${REGISTRY}:${TAG_NAME}"
          source /etc/profile.d/env.sh 
          make docker-build docker-push IMG="${IMAGE_TAG}"
          if [[ "$CHART" == "TRUE" ]]; then
            make helm-push VERSION="${TAG_NAME}"
          fi

          dingtalk_send() {
            local token="cd316d9df306852b6da7d10b3107d852d9a4ad0572a6c4e78cb84c8cacc2c4e5" secret="SECa87a39d5b80e32426d61fe35806fa6f07a9e54cebb29b84bea1d3522c5a71563" title="$1" msg="$2" ts sign
            urlencode(){ local s="$1" c i; for((i=0;i<${#s};i++));do c="${s:i:1}"; case "$c" in [a-zA-Z0-9.~_-]) printf %s "$c";; *) printf '%%%02X' "'$c";; esac; done; }
            json(){ local s="$1"; s=${s//\\/\\\\}; s=${s//\"/\\\"}; s=${s//$'\n'/\\n}; printf %s "$s"; }

            ts=$(($(date +%s)*1000))
            sign=$(urlencode "$(printf '%s\n%s' "$ts" "$secret" | openssl dgst -sha256 -hmac "$secret" -binary | base64 | tr -d '\n')")

            curl -sS -H 'Content-Type: application/json' \
              -d "{\"msgtype\":\"markdown\",\"markdown\":{\"title\":\"$(json "$title")\",\"text\":\"$(json "$msg")\"}}" \
              "https://oapi.dingtalk.com/robot/send?access_token=$token&timestamp=$ts&sign=$sign"
          }
          msg=$(printf '### ✅ 镜像构建成功\n\n- **镜像地址:** `%s`' "$IMAGE_TAG")
          dingtalk_send  "Gitea Action" "$msg"
