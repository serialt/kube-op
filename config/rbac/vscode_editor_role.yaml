# This rule is not used by the project kube-op itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the charts.imau.cc.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kube-op
    app.kubernetes.io/managed-by: kustomize
  name: vscode-editor-role
rules:
- apiGroups:
  - charts.imau.cc
  resources:
  - vscodes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - charts.imau.cc
  resources:
  - vscodes/status
  verbs:
  - get
