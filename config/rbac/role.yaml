---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - web.imau.cc
  resources:
  - vscodes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - web.imau.cc
  resources:
  - vscodes/finalizers
  verbs:
  - update
- apiGroups:
  - web.imau.cc
  resources:
  - vscodes/status
  verbs:
  - get
  - patch
  - update
